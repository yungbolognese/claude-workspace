<?xml version="1.0" encoding="UTF-8"?>
<svg width="1170" height="1500" viewBox="0 0 1170 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7d3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fcd3b5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hairGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hairGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1170" height="1500" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="585" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#1e293b">
    Korean Male Character
  </text>
  <text x="585" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">
    Manga Style Illustration
  </text>

  <!-- Character - Manga Style -->
  <g transform="translate(585, 600)">
    <!-- Hair (Korean male style - textured, messy but styled) -->
    <path d="M-80 -20 Q-100 -50 -70 -90 Q0 -120 70 -90 Q100 -50 80 -20 L70 30 L-70 30 Z" fill="url(#hairGradient1)"/>
    <path d="M-70 30 Q-90 40 -100 70 Q-90 120 -60 110" fill="url(#hairGradient2)"/>
    <path d="M70 30 Q90 40 100 70 Q90 120 60 110" fill="url(#hairGradient2)"/>
    <!-- Top hair texture -->
    <path d="M-60 -50 Q-40 -80 -20 -60 Q0 -90 20 -60 Q40 -80 60 -50" fill="url(#hairGradient1)"/>
    <path d="M-55 -55 Q-35 -75 -15 -60" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none"/>
    <path d="M-15 -60 Q5 -75 25 -55" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none"/>

    <!-- Head shape (manga style - slightly more angular) -->
    <path d="M-55 20 Q-65 60 -65 110 L65 110 Q65 60 55 20 Q40 10 20 10 Q0 0 -20 10 Q-40 10 -55 20" fill="url(#skinGradient)" stroke="#d97706" stroke-width="3"/>

    <!-- Eyes (manga style - large, expressive) -->
    <g>
      <!-- Left Eye -->
      <path d="M-45 45 Q-35 30 -25 45 Q-30 80 -45 80 Z" fill="white" stroke="#0f172a" stroke-width="3"/>
      <ellipse cx="-35" cy="60" rx="14" ry="18" fill="#3b82f6"/>
      <circle cx="-38" cy="56" r="5" fill="white"/>
      <circle cx="-32" cy="65" r="2.5" fill="white" opacity="0.8"/>
      <path d="M-55 48 Q-45 25 -35 48" stroke="#0f172a" stroke-width="3" fill="none"/>
      <path d="M-55 82 Q-45 105 -35 82" stroke="#0f172a" stroke-width="3" fill="none"/>
      <!-- Eyelashes -->
      <path d="M-55 48 Q-60 35 -55 30" stroke="#0f172a" stroke-width="2" fill="none"/>
      <path d="M-45 25 Q-50 10 -45 15" stroke="#0f172a" stroke-width="2" fill="none"/>

      <!-- Right Eye -->
      <path d="M25 45 Q35 30 45 45 Q40 80 25 80 Z" fill="white" stroke="#0f172a" stroke-width="3"/>
      <ellipse cx="35" cy="60" rx="14" ry="18" fill="#3b82f6"/>
      <circle cx="38" cy="56" r="5" fill="white"/>
      <circle cx="32" cy="65" r="2.5" fill="white" opacity="0.8"/>
      <path d="M35 48 Q45 25 55 48" stroke="#0f172a" stroke-width="3" fill="none"/>
      <path d="M35 82 Q45 105 55 82" stroke="#0f172a" stroke-width="3" fill="none"/>
      <!-- Eyelashes -->
      <path d="M55 48 Q60 35 55 30" stroke="#0f172a" stroke-width="2" fill="none"/>
      <path d="M45 25 Q50 10 45 15" stroke="#0f172a" stroke-width="2" fill="none"/>
    </g>

    <!-- Eyebrows (manga style - arched) -->
    <path d="M-55 25 Q-40 15 -25 25" stroke="#0f172a" stroke-width="2.5" fill="none"/>
    <path d="M25 25 Q40 15 55 25" stroke="#0f172a" stroke-width="2.5" fill="none"/>

    <!-- Nose (small, simple dot) -->
    <circle cx="0" cy="55" r="2" fill="#d97706" opacity="0.8"/>

    <!-- Mouth (manga style - small, expressive) -->
    <path d="M-12 85 Q0 92 12 85" stroke="#ef4444" stroke-width="2.5" fill="none"/>
    <path d="M-10 87 Q0 94 10 87" stroke="#fca5a5" stroke-width="1.5" fill="none"/>

    <!-- Blush (subtle oval) -->
    <ellipse cx="-30" cy="65" rx="6" ry="3" fill="#fecaca" opacity="0.5"/>
    <ellipse cx="30" cy="65" rx="6" ry="3" fill="#fecaca" opacity="0.5"/>

    <!-- Body (simplified manga style) -->
    <path d="M-35 115 L35 115 L45 250 L-45 250 Z" fill="#2563eb" stroke="#1e40af" stroke-width="3"/>
    <!-- Neck -->
    <rect x="-10" y="105" width="20" height="30" fill="url(#skinGradient)" stroke="#fcd3b5" stroke-width="2.5"/>
    <!-- Shoulders -->
    <path d="M-35 115 Q-55 130 -60 145" stroke="#2563eb" stroke-width="8" fill="none"/>
    <path d="M35 115 Q55 130 60 145" stroke="#2563eb" stroke-width="8" fill="none"/>
  </g>

  <!-- Exercise Demonstration: Pelvic Tilts -->
  <g transform="translate(100, 1050)">
    <rect width="970" height="200" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="485" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Exercise Demo: Pelvic Tilts</text>
    <!-- Stick figure pose -->
    <circle cx="485" cy="100" r="20" fill="white" stroke="#475566" stroke-width="2"/>
    <line x1="485" y1="120" x2="485" y2="180" stroke="#475566" stroke-width="4"/>
    <line x1="485" y1="130" x2="455" y2="160" stroke="#475566" stroke-width="4"/>
    <line x1="485" y1="130" x2="515" y2="160" stroke="#475566" stroke-width="4"/>
    <line x1="485" y1="180" x2="460" y2="220" stroke="#475566" stroke-width="4"/>
    <line x1="485" y1="180" x2="510" y2="220" stroke="#475566" stroke-width="4"/>
    <text x="485" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">
      lying on back with knees bent
    </text>
  </g>

  <!-- Footer -->
  <rect x="0" y="1450" width="1170" height="50" fill="#6366f1"/>
  <text x="585" y="1480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0e7ff">
    Manga Style Character Reference
  </text>

</svg>